display_information:
  name: 점심 파티
  description: 같이 점심 먹을 사람을 모집해요 🍱
  background_color: "#e8913a"
features:
  bot_user:
    display_name: lunchparty
    always_online: true
  slash_commands:
    - command: /lunch
      description: 점심 파티 모집 시작
      usage_hint: "[식당 이름 / 메뉴 / 지도 URL]"
      should_escape: false
  shortcuts:
    - name: 점심 파티 만들기
      type: global
      callback_id: create_lunch_party
      description: 같이 점심 먹을 사람을 모집해요
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - channels:join
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
